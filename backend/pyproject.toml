[project]
name = "job-tracker-backend"
version = "0.1.0"
description = "Job search assistant API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "anthropic>=0.40",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/File()/Form()/Query() in argument defaults is the FastAPI idiom.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
