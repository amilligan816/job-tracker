# Full dev stack: storage (via infra/) + backend + frontend.
#
#   cp .env.example .env
#   docker compose up --build
#
# Frontend  -> http://localhost:5173
# Backend   -> http://localhost:8000  (docs at /docs)
# MinIO UI  -> http://localhost:9001
name: job-tracker

include:
  - infra/docker-compose.yml

services:
  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobtracker}:${POSTGRES_PASSWORD:-change-me-in-dev}@postgres:5432/${POSTGRES_DB:-jobtracker}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-in-dev}
      S3_BUCKET: ${S3_BUCKET:-job-tracker}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Source mount for --reload. The venv lives at /opt/venv so it is not shadowed.
      - ./backend:/app
    networks:
      - jt-internal
      - jt-external

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Read by the browser, so it must point at the published backend port.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules; don't let the host bind mount hide it.
      - /app/node_modules
    networks:
      - jt-external
